# stories.yaml — Epica "hermad para todos" (ids HPT-*)
# Schema: id / depends_on / files / ac (lo que parsea src/lib/stories.js). Listas INLINE.
# files = rutas repo-relativas exactas; selectParallel evita solape entre stories concurrentes (max 3 devs).
# Olas: 1 = HPT-CLI-TABLE, HPT-CONFIG-PERMS, HPT-DEBTS
#       2 = HPT-COMPLETION, HPT-PROMPTS, HPT-WIZARD-CORE
#       3 = HPT-SETUP, HPT-UPDATE-BMAD
# src/lib/render.js lo comparten CONFIG-PERMS y PROMPTS: PROMPTS depende de CONFIG-PERMS (serie a proposito).
# GATE-SEGURIDAD (Diego): HPT-CONFIG-PERMS y HPT-SETUP implementan el modo de permisos; no se mergean sin su aprobacion.
# HPT-SETUP: D1-D6 del doc ux aprobadas por Diego (2026-10-04); sin bloqueo. El GATE-SEGURIDAD sigue: Diego revisa antes del merge.
# Aceptacion A1 (entorno limpio: setup → create-project → start-team) vive en HPT-SETUP (es el cierre de la via guiada).
# Aceptacion A2 (grep de strings de entorno = 0) vive en HPT-PROMPTS: es duena de los 14 archivos con coincidencias (2026-10-04).
# FR-7.3 (hacer publico el repo DdeDiegoA/hermad) es dependencia de Diego, no una story: no tiene AC por diseno (bloquea solo A1 con un tercero real).

