  ac: ["Given la tabla COMMANDS en src/lib/commands-table.js, when la recorro, then cada entrada tiene name, summary, flags, sub y run, y declara ya los comandos finales de la epica (completion con sus 4 shells mas install y uninstall, settings agents|project|permissions, setup y update con sus flags, spawn con --story) (FR-6.3)", "Given src/cli.js, when despacho un comando, then lo resuelvo con la tabla por name y el switch hardcodeado desaparece; un comando desconocido imprime el HELP y sale 1 (FR-6.3)", "Given hermad --help, when lo corro, then la ayuda se genera desde summary de la tabla y lista los subcomandos con sus flags (FR-6.3)", "Given el test de paridad, when un comando de la tabla no tiene handler o diverge del dispatch, then test/cli-parity.test.js falla (FR-6.4)", "Given el test de paridad, when un literal --flag leido por src/commands/*.js no esta declarado en la tabla de su comando, then el test falla (FR-6.4)", "Given que la tabla declara un comando cuyo handler aun no existe (completion, settings permissions), when corro otro comando, then el require del handler es lazy y el resto del CLI sigue funcionando (FR-6.3)", "Given npm run test, when corre la suite, then test/cli-parity.test.js y test/cli-memory.test.js pasan con execFileSync stub, sin herdr ni red (NFR-3)"]

