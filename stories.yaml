  ac: ["Given hermad spawn dev --story HPT-X, when arranco el agente, then registro la story en state.stories con dev, branch, status assigned y source spawn, con el mismo formato que plan-devs (FR-8.1)", "Given una story ya asignada a otro dev, when corro spawn --story sobre ella, then falla con mensaje claro y no piso el ownership (FR-8.1)", "Given un dev lanzado con spawn --story, when emitio su DONE pero el reviewer no aprobo y la story sigue assigned, then el daemon no cierra su pane (FR-8.2, A7)", "Given un agente registrado como dev-3 o como proyecto-persona, when resuelvo su departamento, then basePersona usa primero state.agents del logico, despues el prefijo del slug del proyecto y despues el prefijo mas largo contra project.personas, y cae en el tab de su persona (FR-8.3, A8)", "Given una persona con guion en su nombre y sin mapa, when basePersona no la reconoce, then devuelve el nombre tal cual y no corta en el primer guion (FR-8.3)", "Given un dev con branch, when el daemon avisa al orquestador por un mensaje sin respuesta, then el aviso incluye branch y commit (FR-8.4)", "Given hermad send con un destino con espacios, when lo parseo, then lo tomo como un solo nombre y no lo parto (FR-8.5)", "Given un logico que quedo en state.closed porque el daemon cerro su pane, when lo relanzo con hermad spawn y el arranque sale bien, then agents.start borra state.closed del logico en el mismo updateState del alta, el daemon le vuelve a entregar el buzon y no repite el aviso de respawn (FR-8.2)", "Given npm run test, when corre, then test/spawn-story.test.js, test/base-persona.test.js, test/placement.test.js, test/daemon.test.js y test/agents.test.js pasan con io stub, sin herdr, incluido el relanzamiento de un agente cerrado (NFR-3)"]

