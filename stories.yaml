tion con default No y solo lo instalo con --completion (FR-6.6)", "Given hermad skills suggest sin vendor autenticado, when corre, then cae al matcher local y no termina en process.exit 1, porque el exit queda en el borde del CLI (FR-2.3)", "Given un entorno limpio con un vendor y herdr, when corro setup, create-project y start-team, then termina sin errores y sin warnings de skills (A1)", "Given npm run test, when corre, then test/setup-headless.test.js, test/setup-permissions.test.js y test/discovery.test.js pasan con stdin cerrado y sin red (NFR-3)"]

